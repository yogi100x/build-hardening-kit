# Universal hook runner — replaces Husky + lint-staged with one language-agnostic tool.
# Install: pipx install pre-commit && pre-commit install   (or: uvx pre-commit install)
# Run on all files: pre-commit run --all-files
# Hooks give fast local feedback. They can be skipped (--no-verify); CI is the gate.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: check-json

  # --- Python ---
  # Runs the ruff your project locks (uv run), so the hook and CI never disagree
  # on formatting after a ruff release.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

  # --- Go ---
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
      - id: golangci-lint

  # --- JS/TS/JSON/MD/YAML formatting (maintained Prettier mirror) ---
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.10.1
    hooks:
      - id: prettier

  # --- Shell / Dockerfile (the "others") ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.1-beta
    hooks:
      - id: hadolint # needs the hadolint binary on PATH when a Dockerfile exists

  # --- Secrets (language-agnostic) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- Universal custom rules (any language) ---
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep custom rules
        entry: semgrep --config semgrep/rules.yml --error --skip-unknown-extensions
        language: python
        additional_dependencies: [semgrep==1.186.0]
        pass_filenames: false
