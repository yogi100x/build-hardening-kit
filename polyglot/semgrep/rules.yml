# Universal custom AST rules — ONE rule file matches Go, Python, JS/TS, Java, Ruby, etc.
# semgrep is the polyglot replacement for a per-language custom-lint plugin.
# Ratchet across ALL languages: `semgrep ci --baseline-commit <main-sha>` reports only NEW findings.
rules:
  - id: no-raw-db-query-outside-dal
    languages: [go, python, javascript, typescript]
    severity: ERROR
    message: >-
      Raw DB query outside the data-access layer. Move it into a DAL function
      so access control and query patterns stay centralized.
    patterns:
      - pattern-either:
          - pattern: $DB.query(...)
          - pattern: $DB.Query(...)
          - pattern: $DB.execute(...)
          - pattern: $DB.Exec(...)
    paths:
      exclude:
        - "**/dal/**"
        - "**/data_access/**"

  - id: no-hardcoded-secret-assignment
    languages: [go, python, javascript, typescript]
    severity: ERROR
    message: Possible hardcoded secret. Load from env/secret manager instead.
    patterns:
      - pattern-regex: '(?i)(api_?key|secret|password|token)\s*[:=]\s*["''][A-Za-z0-9_\-]{16,}["'']'
