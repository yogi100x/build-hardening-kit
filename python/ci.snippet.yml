# Drop this job into .github/workflows/ci.yml (or the polyglot matrix).
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy pytest
      - run: ruff check . # lint
      - run: ruff format --check . # format gate
      - run: mypy . # type gate (strict)
      - run: pytest -q
