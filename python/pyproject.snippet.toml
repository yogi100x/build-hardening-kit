# Merge into pyproject.toml. Ruff replaces black + flake8 + isort + pyupgrade + bandit.
# mypy --strict is Python's analog of TS strict / checkJs: it turns type hints into a gate.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "F", "W", # pyflakes + pycodestyle
  "I",           # isort (import order)
  "UP",          # pyupgrade (modern syntax)
  "B",           # flake8-bugbear (likely bugs)
  "C4",          # comprehension simplifications
  "SIM",         # code simplifications
  "S",           # flake8-bandit (security)
  "PTH",         # prefer pathlib over os.path
  "ASYNC",       # async footguns
  "RUF",         # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert allowed in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
exclude = ["build/", "dist/"]
