# golangci-lint v2 config. golangci-lint bundles 50+ linters and the formatters,
# so `golangci-lint run` is Go's lint + format gate in one binary.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - revive # style + custom rules (golint successor)
    - gosec # security scanner
    - gocritic # opinionated checks + RULEGUARD host (see rules.go)
    - bodyclose # unclosed HTTP bodies
    - rowserrcheck # unchecked sql.Rows.Err
    - sqlclosecheck # unclosed sql.Rows/Stmt
    - errorlint # wrong error wrapping
    - nilerr # returning nil after err check
    - misspell
  settings:
    govet:
      enable-all: true
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      settings:
        ruleguard:
          rules: "${base-path}/rules.go" # custom AST rules, see rules.go

formatters:
  enable:
    - gofmt
    - gci # deterministic import order
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/yourorg) # <-- set your module path

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # RATCHET: only flag issues introduced since main. Existing debt passes.
  # Set here only, so local runs and CI agree.
  new-from-rev: origin/main

severity:
  default: error
