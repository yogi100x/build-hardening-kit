# Drop this job into .github/workflows/ci.yml (or the polyglot matrix).
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --new-from-rev needs history
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -covermode=atomic ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --new-from-rev=origin/main # ratchet
